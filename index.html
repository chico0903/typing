<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYPING GAME</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #212529;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* 메인 랜딩 화면 */
    .landing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      width: 100%;
      max-width: 500px;
      padding: 40px;
    }

    .main-title {
      font-size: 3rem;
      font-weight: 900;
      color: #B3EBA9;
      letter-spacing: 2px;
    }

    .landing-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      text-align: center;
    }

    .landing-form input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      font-size: 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      color: #000000;
      background: #f8fafc;
      outline: none;
    }

    .landing-form input[type="text"]:focus {
      border-color: #B3EBA9;
    }

    .landing-form button {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #212529;
      background-color: #B3EBA9;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .loading-msg {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    /* 게임 플레이 화면 */
    .app-container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
      border: 1px solid #edf2f7;
    }

    .video-section {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .feedback-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: 3rem;
      font-weight: 900;
      color: #B3EBA9;
      text-shadow: 0 0 20px rgba(179, 235, 169, 0.8), 2px 2px 0 #000;
      pointer-events: none;
      z-index: 10;
      animation: popUp 0.6s ease-out forwards;
    }

    @keyframes popUp {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .stat-item {
      color: #111;
    }

    .stat-label {
      color: #888;
      font-size: 0.85rem;
      font-weight: 400;
    }

    .buttons-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: #f1f3f5;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      width: 34px;
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 0.9rem;
      color: #494949;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.85rem;
      color: #494949;
      margin-left: 5px;
    }

    .volume-slider {
      width: 70px;
      accent-color: #B3EBA9;
      cursor: pointer;
    }

    .time-stat {
      font-size: 0.85rem;
      color: #888;
    }

    .typing-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 20px 0;
    }

    .target-display {
      font-size: 2rem;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.5px;
      min-height: 50px;
    }

    /* 색상 지정 */
    .char-pending {
      color: #494949; /* 입력 전 기본 색상 */
    }

    .char-correct {
      color: #B3EBA9; /* 맞았을 때 초록색 */
      font-weight: 600;
    }

    .char-incorrect {
      color: #F17864; /* 틀렸을 때 빨간색 */
      text-decoration: underline;
      background-color: rgba(241, 120, 100, 0.15);
    }

    .input-wrapper {
      width: 100%;
      max-width: 600px;
    }

    #typing-input {
      width: 100%;
      padding: 14px 20px;
      font-size: 1.2rem;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      background: #f8f9fa;
      color: #212529;
      text-align: center;
      outline: none;
    }

    #typing-input:focus {
      border-color: #B3EBA9;
    }
  </style>
</head>
<body>
  <!-- 메인 랜딩 화면 -->
  <div class="landing-container" id="landing-section">
    <h1 class="main-title">TYPING GAME</h1>
    <div class="landing-form">
      <input type="text" id="youtube-url" placeholder="유튜브 영상 URL을 입력하세요" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
      <button id="start-btn">GAME START</button>
      <div id="loading-msg" class="loading-msg hidden">자막을 동기화하고 있습니다... ⏳</div>
    </div>
  </div>

  <!-- 게임 플레이 화면 -->
  <div class="app-container hidden" id="game-section">
    <div class="video-section">
      <div class="video-wrapper">
        <div id="player"></div>
        <div id="feedback-overlay" class="feedback-overlay hidden">EXCELLENT!</div>
      </div>
    </div>

    <div class="control-bar">
      <div class="stats-group">
        <span class="stat-item" id="progress-stat">0/0</span>
        <span class="stat-label">타속</span>
        <span class="stat-item" id="cpm-stat">0타</span>
        <span class="stat-label">정확도</span>
        <span class="stat-item" id="accuracy-stat">100%</span>
      </div>
      <div class="buttons-group">
        <button class="icon-btn" id="prev-btn" title="이전">〈</button>
        <button class="icon-btn" id="play-pause-btn" title="재생/일시정지">❚❚</button>
        <button class="icon-btn" id="restart-btn" title="처음부터">↺</button>
        <button class="icon-btn" id="next-btn" title="다음">〉</button>
        
        <div class="volume-container">
          <span>🔊</span>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100">
        </div>
      </div>
      <div class="time-stat" id="time-stat">00:00 / 00:00</div>
    </div>

    <div class="typing-section">
      <div class="target-display" id="target-display">
        <span class="char-pending">자막 로딩 중...</span>
      </div>
      <div class="input-wrapper">
        <input type="text" id="typing-input" placeholder="" autocomplete="off" autofocus>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let subtitles = [];
    let currentIndex = 0;
    let totalTypedChars = 0;
    let totalErrors = 0;
    let sentenceStartTime = null;
    let isPausedByTyping = false;
    let targetVideoId = 'dQw4w9WgXcQ';
    let audioCtx = null;

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 거슬리지 않는 은은한 틀림 효과음 (Web Audio API)
    function playSoftErrorSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine'; // 부드러운 사인 파형
        osc.frequency.setValueAtTime(160, audioCtx.currentTime); // 약간 낮은 부드러운 톤 (160Hz)
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.08); // 살짝 떨어지는 톤

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime); // 거슬리지 않도록 작은 볼륨 (0.08)
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {
        // 오디오 미지원 디바이스 처리
      }
    }

    // 한글 타수 계산 (초성, 중성, 종성 획수 분해)
    function countHancomStroke(text) {
      let count = 0;
      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          const charIndex = code - 0xAC00;
          const jong = charIndex % 28;
          count += (jong > 0) ? 3 : 2;
        } else {
          count += 1;
        }
      }
      return count;
    }

    async function fetchSubtitles(videoId) {
      const apiEndpoints = [
        `https://pipedapi.kavin.rocks/streams/${videoId}`,
        `https://api.invidious.io/api/v1/videos/${videoId}`,
        `https://vid.puffyan.us/api/v1/videos/${videoId}`
      ];

      for (let endpoint of apiEndpoints) {
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;
          const data = await res.json();
          
          let subTrack = null;
          if (data.subtitles && data.subtitles.length > 0) {
            subTrack = data.subtitles.find(s => s.code === 'ko') || data.subtitles[0];
          } else if (data.captions && data.captions.length > 0) {
            subTrack = data.captions.find(c => c.languageCode === 'ko') || data.captions[0];
          }

          if (subTrack && subTrack.url) {
            const subRes = await fetch(subTrack.url);
            const subText = await subRes.text();
            const parsed = parseSubText(subText);
            if (parsed && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.warn(`프록시 연결 시도 중...`, e);
        }
      }

      // 자막을 완전히 추출하지 못했을 때를 위한 예시 자막 싱크 데이터
      return [
        { start: 0, end: 4, text: "I want to see the whole world," },
        { start: 4, end: 8, text: "도장 찍어, 나의 passport" },
        { start: 8, end: 12, text: "What you want" },
        { start: 12, end: 16, text: "Never gonna give you up and let you down" }
      ];
    }

    function parseSubText(text) {
      if (text.includes('-->')) {
        const lines = text.split('\n');
        let result = [];
        let current = null;

        for (let line of lines) {
          line = line.trim();
          if (line.includes('-->')) {
            const parts = line.split('-->');
            current = {
              start: parseTime(parts[0].trim()),
              end: parseTime(parts[1].trim()),
              text: ''
            };
          } else if (current && line !== '' && !line.startsWith('WEBVTT') && isNaN(line)) {
            current.text = (current.text + ' ' + line).trim().replace(/<[^>]*>/g, '');
            result.push(current);
            current = null;
          }
        }
        return result;
      }
      return [];
    }

    function parseTime(tStr) {
      const parts = tStr.split(':');
      if (parts.length === 3) {
        return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2].replace(',', '.'));
      } else if (parts.length === 2) {
        return parseFloat(parts[0]) * 60 + parseFloat(parts[1].replace(',', '.'));
      }
      return 0;
    }

    document.getElementById('start-btn').addEventListener('click', async () => {
      const urlInput = document.getElementById('youtube-url').value;
      const extractedId = extractVideoId(urlInput);

      if (!extractedId) {
        alert('올바른 유튜브 URL을 입력해 주세요.');
        return;
      }
      targetVideoId = extractedId;

      const loadingMsg = document.getElementById('loading-msg');
      loadingMsg.classList.remove('hidden');

      subtitles = await fetchSubtitles(targetVideoId);
      loadingMsg.classList.add('hidden');

      document.getElementById('landing-section').classList.add('hidden');
      document.getElementById('game-section').classList.remove('hidden');

      if (!player) {
        player = new YT.Player('player', {
          height: '360',
          width: '640',
          videoId: targetVideoId,
          playerVars: {
            'autoplay': 1,
            'rel': 0,
            'iv_load_policy': 3
          },
          events: {
            'onReady': onPlayerReady
          }
        });
      } else {
        player.loadVideoById({
          videoId: targetVideoId
        });
        currentIndex = 0;
        loadCurrentSubtitle();
      }
    });

    function onPlayerReady(event) {
      loadCurrentSubtitle();
      setInterval(updateTimerAndSync, 200);

      const volumeSlider = document.getElementById('volume-slider');
      volumeSlider.addEventListener('input', (e) => {
        if (player && player.setVolume) {
          player.setVolume(e.target.value);
        }
      });
    }

    function updateTimerAndSync() {
      if (!player || !player.getCurrentTime || subtitles.length === 0 || currentIndex >= subtitles.length) return;
      
      const currentTime = player.getCurrentTime();
      const duration = player.getDuration() || 0;
      
      document.getElementById('time-stat').textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;

      const currentSub = subtitles[currentIndex];
      if (currentTime >= currentSub.end && !isPausedByTyping) {
        player.pauseVideo();
        isPausedByTyping = true;
        document.getElementById('play-pause-btn').textContent = '▶';
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    const targetDisplay = document.getElementById('target-display');
    const typingInput = document.getElementById('typing-input');
    const cpmStat = document.getElementById('cpm-stat');
    const accuracyStat = document.getElementById('accuracy-stat');
    const progressStat = document.getElementById('progress-stat');
    const feedbackOverlay = document.getElementById('feedback-overlay');
    let lastInputLength = 0;

    function loadCurrentSubtitle() {
      if (currentIndex >= subtitles.length) {
        targetDisplay.innerHTML = "<span style='color: #B3EBA9;'>🎉 모든 자막 타자를 완료하셨습니다!</span>";
        typingInput.disabled = true;
        if (player && player.pauseVideo) player.pauseVideo();
        return;
      }

      const currentSub = subtitles[currentIndex];
      renderText('');
      progressStat.textContent = `${currentIndex + 1}/${subtitles.length}`;
      
      if (player && player.seekTo) {
        player.seekTo(currentSub.start);
        player.playVideo();
        document.getElementById('play-pause-btn').textContent = '❚❚';
      }
      isPausedByTyping = false;
      sentenceStartTime = null;
      lastInputLength = 0;
    }

    function renderText(inputVal) {
      if (subtitles.length === 0) return { errors: 0, hasNewError: false };
      const targetText = subtitles[currentIndex].text;
      let html = '';
      let currentErrors = 0;
      let hasNewError = false;

      for (let i = 0; i < targetText.length; i++) {
        const targetChar = targetText[i];
        const inputChar = inputVal[i];

        if (inputChar == null) {
          html += `<span class="char-pending">${targetChar}</span>`;
        } else if (inputChar === targetChar) {
          html += `<span class="char-correct">${targetChar}</span>`;
        } else {
          html += `<span class="char-incorrect">${targetChar}</span>`;
          currentErrors++;
          // 새로 타이핑해서 입력한 글자가 틀렸을 때만 효과음 1회 재생
          if (i === inputVal.length - 1 && inputVal.length > lastInputLength) {
            hasNewError = true;
          }
        }
      }

      targetDisplay.innerHTML = html;
      return { errors: currentErrors, hasNewError: hasNewError };
    }

    typingInput.addEventListener('input', (e) => {
      if (subtitles.length === 0) return;
      
      if (!sentenceStartTime) {
        sentenceStartTime = new Date();
      }

      const inputVal = typingInput.value;
      const targetText = subtitles[currentIndex].text;
      const renderResult = renderText(inputVal);

      // 새로 타이핑해서 틀린 경우에만 은은한 비프음 재생 (키보드 타격음은 없음)
      if (renderResult.hasNewError) {
        playSoftErrorSound();
      }
      lastInputLength = inputVal.length;

      // 한컴타자 방식 실시간 타속 계산
      const elapsedSeconds = (new Date() - sentenceStartTime) / 1000;
      const strokeCount = countHancomStroke(inputVal);
      
      let cpm = 0;
      if (elapsedSeconds > 0.3) {
        cpm = Math.round((strokeCount / elapsedSeconds) * 60);
      }
      
      const currentTypedCount = totalTypedChars + inputVal.length;
      const totalErrCount = totalErrors + renderResult.errors;
      const accuracy = currentTypedCount > 0 ? Math.max(0, Math.round(100 - (totalErrCount / currentTypedCount) * 100)) : 100;

      cpmStat.textContent = `${cpm}타`;
      accuracyStat.textContent = `${accuracy}%`;

      if (inputVal === targetText) {
        totalTypedChars += targetText.length;
        totalErrors += renderResult.errors;

        showFeedback();

        currentIndex++;
        typingInput.value = '';
        loadCurrentSubtitle();
      }
    });

    function showFeedback() {
      const feedbacks = ["GOOD JOB!", "EXCELLENT!", "PERFECT!", "AWESOME!"];
      const randomFeedback = feedbacks[Math.floor(Math.random() * feedbacks.length)];
      
      feedbackOverlay.textContent = randomFeedback;
      feedbackOverlay.classList.remove('hidden');

      feedbackOverlay.style.animation = 'none';
      feedbackOverlay.offsetHeight; 
      feedbackOverlay.style.animation = 'popUp 0.6s ease-out forwards';

      setTimeout(() => {
        feedbackOverlay.classList.add('hidden');
      }, 600);
    }

    document.getElementById('play-pause-btn').addEventListener('click', () => {
      if (!player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        document.getElementById('play-pause-btn').textContent = '▶';
      } else {
        player.playVideo();
        document.getElementById('play-pause-btn').textContent = '❚❚';
      }
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      currentIndex = 0;
      typingInput.disabled = false;
      loadCurrentSubtitle();
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        loadCurrentSubtitle();
      }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIndex < subtitles.length - 1) {
        currentIndex++;
        loadCurrentSubtitle();
      }
    });
  </script>
</body>
</html>
